version: "3.9"

services:
  # Interactive CLI agent
  agent:
    build: .
    container_name: ai_agent_cli
    env_file: .env
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
    stdin_open: true
    tty: true
    restart: unless-stopped

  # FastAPI server
  api:
    build: .
    container_name: ai_agent_api
    env_file: .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Optional: Nginx reverse proxy (production)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - api
  #   restart: unless-stopped
