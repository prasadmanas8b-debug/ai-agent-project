version: "3.9"

services:
  agent:
    build: .
    container_name: ai_agent_system
    env_file: .env
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
    stdin_open: true
    tty: true

  api:
    build: .
    container_name: ai_agent_api
    env_file: .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
